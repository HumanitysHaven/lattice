name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # relay-client's Tor dependency (arti-client) pulls in ~500 crates; caching keeps CI
      # fast on unchanged dependencies instead of rebuilding that tree every run.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      # Whole workspace: core (pure, no-network) plus the networked relay edges
      # (relay-client, relay), which pull in arti-client/tokio and take noticeably longer to
      # build/link than core alone.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Doc tests
        run: cargo test --workspace --doc
