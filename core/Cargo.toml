[package]
name = "lattice-core"
version = "0.0.1"
edition = "2021"
description = "Security-critical core for a local-first web of trust for at-risk communities"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "lattice_core"
path = "src/lib.rs"

[dependencies]
# Audited cryptography only (req 7.3 — no home-grown crypto).
ed25519-dalek = { version = "2", features = ["zeroize"] }
bip39 = "2"
getrandom = "0.2"
sha2 = "0.10"
zeroize = "1"
# Encryption at rest (req 7.3/7.6): Argon2id KDF + XChaCha20-Poly1305 AEAD.
argon2 = "0.5"
chacha20poly1305 = "0.10"
# Compact, no-std-friendly serialization of the persisted trust store.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
# 1:1 messaging (req 7.3): audited pure-Rust Double Ratchet (Olm). We do NOT roll our own
# ratchet. Spec named libsignal, which is not consumable as a hermetic Rust crate (git-only,
# AGPL, BoringSSL + forked deps); vodozemac is the audited (Least Authority), crates.io,
# pure-Rust Double Ratchet used across the Matrix ecosystem. See docs/technical-spec.md §7.3.
vodozemac = "0.10"

[dev-dependencies]
